<aside id="primary-navigation" class="sidebar" [attr.data-open]="open()">
  <div class="sidebar__mobile-heading">
    <span>Navegación</span>
    <button type="button" aria-label="Cerrar navegación" (click)="closeRequested.emit()">
      <i class="pi pi-times" aria-hidden="true"></i>
    </button>
  </div>

  <nav class="sidebar__nav" aria-label="Navegación principal">
    <p class="sidebar__section-label">Workspace</p>
    <ul>
      @for (item of navigationItems; track item.route; let first = $first) {
        <li>
          <a
            #firstLink
            [attr.data-first-link]="first ? '' : null"
            [routerLink]="item.route"
            routerLinkActive="is-active"
            ariaCurrentWhenActive="page"
            (click)="navigationSelected.emit()"
          >
            <i [class]="item.icon" aria-hidden="true"></i>
            <span>{{ item.label }}</span>
          </a>
        </li>
      }
    </ul>
  </nav>

  <div class="sidebar__phase">
    <i class="pi pi-wrench" aria-hidden="true"></i>
    <span>
      <strong>Fase 2</strong>
      <small>Organizations &amp; branches</small>
    </span>
  </div>
</aside>
