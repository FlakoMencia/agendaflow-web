<section class="not-found-shell" aria-labelledby="access-denied-title">
  <p class="eyebrow">Error 403</p>
  <h1 id="access-denied-title">Access denied</h1>
  <p>
    You do not have permission to use this area. Contact an administrator if access is required.
  </p>
  <a class="return-link" [routerLink]="returnRoute">
    <i class="pi pi-arrow-left" aria-hidden="true"></i>
    <span>Return to an available area</span>
  </a>
</section>
