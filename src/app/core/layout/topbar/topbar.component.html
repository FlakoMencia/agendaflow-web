<header class="topbar" (keydown.escape)="closeAccountMenu()">
  <div class="topbar__brand-group">
    <button
      #menuButton
      class="topbar__menu-button"
      type="button"
      aria-label="Abrir o cerrar navegación principal"
      aria-controls="primary-navigation"
      [attr.aria-expanded]="navigationExpanded()"
      (click)="navigationToggle.emit()"
    >
      <i class="pi pi-bars" aria-hidden="true"></i>
    </button>

    <a class="topbar__brand" routerLink="/dashboard" aria-label="AgendaFlow, ir al dashboard">
      <span class="topbar__brand-mark" aria-hidden="true">A</span>
      <span>AgendaFlow</span>
    </a>

    <span class="environment-badge">
      <span class="environment-badge__dot" aria-hidden="true"></span>
      Development
    </span>
  </div>

  @if (user(); as currentUser) {
    <div class="account-menu">
      <button
        class="account-menu__trigger"
        type="button"
        aria-controls="session-menu"
        [attr.aria-expanded]="accountMenuOpen()"
        (click)="toggleAccountMenu()"
      >
        <span>
          <strong>{{ displayName() }}</strong>
          <small>{{ activeOrganization()?.tradeName || activeOrganization()?.legalName }}</small>
        </span>
        <i class="pi pi-chevron-down" aria-hidden="true"></i>
      </button>
      @if (accountMenuOpen()) {
        <div id="session-menu" class="account-menu__panel" role="menu">
          <div class="account-menu__identity">
            <strong>{{ displayName() }}</strong>
            <small>{{ currentUser.email }}</small>
          </div>
          <button type="button" role="menuitem" (click)="signOut()">
            <i class="pi pi-sign-out" aria-hidden="true"></i>
            <span>Sign out</span>
          </button>
        </div>
      }
    </div>
  }
</header>
